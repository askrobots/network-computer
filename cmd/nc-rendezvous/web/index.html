<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Network Computer</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#15181d; --panel2:#1d222a; --line:#2a2f38;
    --text:#e7ebf0; --dim:#9aa4b2; --accent:#4c8dff; --accent2:#3ad29f;
    --warn:#ffb454; --bad:#ff5d5d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}

  /* ---------- connect screen ---------- */
  #connect{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:24px;background:radial-gradient(1200px 600px at 50% -10%, #182030, var(--bg))}
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:20px}
  .brand h1{font-size:19px;margin:0;font-weight:650;letter-spacing:.2px}
  .brand p{margin:0;color:var(--dim);font-size:12px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}
  .field input,.field select{width:100%;padding:10px 12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:9px;outline:none}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row .field{flex:1}
  .hostrow{display:flex;gap:8px;align-items:flex-end}
  .hostrow .field{flex:1;margin-bottom:0}
  .icon-btn{padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    color:var(--dim);line-height:1;height:40px}
  .icon-btn:hover{color:var(--text);border-color:var(--accent)}
  .toggles{display:flex;flex-direction:column;gap:8px;margin:8px 0 18px}
  .toggle{display:flex;align-items:center;gap:9px;color:var(--dim);font-size:13px;cursor:pointer}
  .toggle input{width:16px;height:16px;accent-color:var(--accent)}
  .connect-btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:600;font-size:15px;
    background:linear-gradient(135deg,var(--accent),#3f7ef0);color:#fff}
  .connect-btn:disabled{opacity:.6;cursor:default}
  .connect-btn.busy{background:var(--panel2);color:var(--dim)}
  .msg{margin-top:12px;font-size:13px;min-height:18px}
  .msg.err{color:var(--bad)} .msg.ok{color:var(--accent2)} .msg.info{color:var(--dim)}
  .hint{margin-top:16px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}

  /* ---------- session ---------- */
  #session{position:fixed;inset:0;display:none;background:#000}
  #session.on{display:block}
  #stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
  video{max-width:100%;max-height:100%;display:block;background:#000}
  #cursor{position:absolute;width:22px;height:22px;margin:-3px 0 0 -3px;pointer-events:none;
    opacity:0;transition:opacity .25s;z-index:5;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  #cursor.on{opacity:1}

  /* toolbar: compact and centred, hidden until the pointer rests against the very
     top edge (or the handle is clicked), so the desktop's own top panel stays usable */
  #bar{position:absolute;top:0;left:50%;transform:translate(-50%,0);z-index:20;display:flex;align-items:center;gap:6px;
    padding:6px 8px;margin-top:env(safe-area-inset-top,0px);background:#12151ae6;border:1px solid var(--line);
    border-top:none;border-radius:0 0 12px 12px;backdrop-filter:blur(8px);transition:opacity .25s,transform .25s}
  #bar.hidden{opacity:0;transform:translate(-50%,-110%);pointer-events:none}
  #bar .pill{pointer-events:none}
  #barhandle{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:19;width:56px;height:6px;
    margin-top:env(safe-area-inset-top,0px);border-radius:0 0 6px 6px;background:#4c8dff88;cursor:pointer}
  .pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;background:#1c2129cc;
    border:1px solid var(--line);border-radius:20px;font-size:12.5px;backdrop-filter:blur(8px)}
  .pill.host{font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent2)}
  .dot.relay{background:var(--warn)} .dot.bad{background:var(--bad)}
  #bar .spacer{flex:1}
  .bar-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#1c2129cc;
    color:var(--text);display:grid;place-items:center;font-size:15px;backdrop-filter:blur(8px)}
  .bar-btn:hover{border-color:var(--accent)}
  .bar-btn.active{background:var(--accent);border-color:var(--accent)}

  /* mic panel: which microphone, and a live level so "it hears me" is obvious */
  #micpanel{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
    z-index:16;display:none;align-items:center;gap:10px;padding:8px 12px;background:#12151acc;
    border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);font-size:12.5px}
  #micpanel.on{display:flex}
  #disppanel{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:12px;z-index:16;display:none;
    align-items:center;gap:8px;padding:8px 12px;background:#12151acc;border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(8px);font-size:12.5px}
  #disppanel.on{display:flex}
  #disppanel select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  #micpanel select{max-width:220px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
  #micmeter{width:120px;height:8px;border-radius:4px;background:#0c0f13;overflow:hidden}
  #micmeter i{display:block;height:100%;width:0;background:var(--accent2);transition:width .08s linear}
  #micquiet{color:var(--warn);display:none}

  /* stats card */
  #stats{position:absolute;top:60px;top:calc(56px + env(safe-area-inset-top,0px));left:12px;z-index:15;
    background:#12151acc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
    backdrop-filter:blur(8px);display:none;min-width:210px}
  #stats.on{display:block}
  #stats b{color:var(--text);font-weight:600}
  #stats .k{display:inline-block;width:64px;color:var(--dim)}

  /* graphs panel */
  #graphs{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:12px;z-index:15;
    width:280px;background:#12151acc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    backdrop-filter:blur(8px);display:none}
  #graphs.on{display:block}
  .g{margin-bottom:9px}
  .g:last-child{margin-bottom:0}
  .g-head{display:flex;justify-content:space-between;font:11px ui-monospace,Menlo,monospace;color:var(--dim);margin-bottom:2px}
  .g-head b{color:var(--text);font-weight:600}
  .g canvas{width:100%;height:34px;display:block;border-radius:4px;background:#0c0f13}

  /* keyboard bar */
  #keys{position:absolute;left:0;right:0;bottom:0;z-index:20;display:none;gap:6px;padding:10px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));overflow-x:auto;
    background:linear-gradient(#0000,#000c);scrollbar-width:none}
  #keys.on{display:flex}
  #keys::-webkit-scrollbar{display:none}
  .key{flex:0 0 auto;padding:9px 13px;background:#1c2129e6;border:1px solid var(--line);
    border-radius:8px;font:13px ui-monospace,Menlo,monospace}
  .key.sticky.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* toast + reconnect overlay */
  #toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);z-index:25;
    background:#12151aee;border:1px solid var(--line);border-radius:20px;padding:8px 16px;font-size:13px;
    opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.on{opacity:1}
  #reconnect{position:absolute;inset:0;z-index:18;display:none;place-items:center;background:#000a}
  #reconnect.on{display:grid}
  .spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #disppanel label{display:flex;align-items:center;gap:4px;white-space:nowrap}
  #clipbox{position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0}
</style>

<!-- ================= CONNECT ================= -->
<div id="connect">
  <div class="card">
    <div class="brand">
      <div class="logo">🖥️</div>
      <div><h1>Network Computer</h1><p>Your phone is the terminal</p></div>
    </div>
    <div class="field">
      <label>Rendezvous</label>
      <input id="f-url" placeholder="https://host:8765" autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <div class="row">
      <div class="field"><label>User</label>
        <input id="f-user" value="nc" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="field"><label>Password</label>
        <input id="f-pass" type="password" autocomplete="off"></div>
    </div>
    <div class="hostrow">
      <div class="field"><label>Host</label>
        <select id="f-host"><option value="">—</option></select></div>
      <button class="icon-btn" id="f-refresh" title="Refresh hosts">↻</button>
    </div>
    <div class="field" style="margin-top:14px"><label>Host PIN</label>
      <input id="f-pin" inputmode="numeric" placeholder="6 digits" autocomplete="off"></div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="f-cursor" checked> Local cursor (snappier pointer)</label>
      <label class="toggle"><input type="checkbox" id="f-relay"> Force TURN relay</label>
    </div>
    <button class="connect-btn" id="f-connect">Connect</button>
    <div class="msg info" id="f-msg"></div>
    <div class="hint">Click the screen to control it · Shift+Esc releases the mouse</div>
  </div>
</div>

<!-- ================= SESSION ================= -->
<div id="session">
  <div id="stage">
    <video id="v" autoplay playsinline></video>
    <svg id="cursor" viewBox="0 0 24 24"><path d="M4 2l16 9-7 1.5L9.5 20z" fill="#fff" stroke="#000" stroke-width="1.2"/></svg>
  </div>

  <div id="barhandle" title="Show the toolbar"></div>
  <div id="bar">
    <span class="pill host"><span class="dot" id="dot"></span><span id="p-host">—</span></span>
    <span class="pill" id="p-net">connecting…</span>
    <button class="bar-btn" id="b-display" title="Screen size and scale">🖥️</button>
    <button class="bar-btn" id="b-mic" title="Microphone">🎤</button>
    <button class="bar-btn" id="b-graphs" title="Graphs">📈</button>
    <button class="bar-btn" id="b-stats" title="Stats">📊</button>
    <button class="bar-btn" id="b-clipup" title="Send this device's clipboard to the desk">📋↑</button>
    <button class="bar-btn" id="b-clipdown" title="Copy the desk's clipboard to this device">📋↓</button>
    <button class="bar-btn" id="b-keys" title="Keyboard">⌨️</button>
    <button class="bar-btn" id="b-full" title="Fullscreen">⛶</button>
    <button class="bar-btn" id="b-quit" title="Disconnect">✕</button>
  </div>

  <div id="stats"></div>
  <div id="disppanel" class="panel">
    <span>🖥️</span>
    <select id="d-res" title="Screen size"></select>
    <select id="d-scale" title="Text and UI scale"></select>
    <span>⌨️</span>
    <select id="d-kbd" title="The layout of the keyboard on this device"></select>
    <label id="d-cmdl" title="⌘C, ⌘V, ⌘Z… work as Ctrl shortcuts on the desk" hidden><input type="checkbox" id="d-cmd"> ⌘ = Ctrl</label>
  </div>
  <textarea id="clipbox" aria-hidden="true" tabindex="-1"></textarea>
  <div id="micpanel">
    <span>🎤</span>
    <select id="mic-dev" title="Microphone"></select>
    <div id="micmeter"><i></i></div>
    <span id="micquiet">not hearing you — pick another mic</span>
  </div>
  <div id="graphs">
    <div class="g"><div class="g-head"><span>frame rate</span><b id="gv-fps">0 fps</b></div><canvas id="gc-fps"></canvas></div>
    <div class="g"><div class="g-head"><span>bitrate</span><b id="gv-mbps">0 Mb/s</b></div><canvas id="gc-mbps"></canvas></div>
    <div class="g"><div class="g-head"><span>packet loss</span><b id="gv-loss">0 /s</b></div><canvas id="gc-loss"></canvas></div>
    <div class="g"><div class="g-head"><span>round trip</span><b id="gv-rtt">0 ms</b></div><canvas id="gc-rtt"></canvas></div>
    <div class="g"><div class="g-head"><span>jitter</span><b id="gv-jit">0 ms</b></div><canvas id="gc-jit"></canvas></div>
  </div>

  <div id="keys">
    <button class="key" data-code="Escape">esc</button>
    <button class="key sticky" data-code="ControlLeft">ctrl</button>
    <button class="key sticky" data-code="AltLeft">alt</button>
    <button class="key sticky" data-code="MetaLeft">cmd</button>
    <button class="key" data-code="Tab">tab</button>
    <button class="key" data-combo="ControlLeft+KeyC">^C</button>
    <button class="key" data-combo="ControlLeft+KeyV">^V</button>
    <button class="key" data-code="ArrowLeft">←</button>
    <button class="key" data-code="ArrowUp">↑</button>
    <button class="key" data-code="ArrowDown">↓</button>
    <button class="key" data-code="ArrowRight">→</button>
    <button class="key" data-code="Home">home</button>
    <button class="key" data-code="End">end</button>
    <button class="key" data-code="Delete">del</button>
  </div>

  <div id="toast"></div>
  <div id="reconnect"><div style="text-align:center"><div class="spin"></div>
    <div style="margin-top:14px;color:var(--dim)">Reconnecting…</div></div></div>
</div>

<script>
const $=s=>document.querySelector(s);
const store={
  get:(k,d)=>{try{const v=localStorage.getItem('nc.'+k);return v===null?d:v}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem('nc.'+k,v)}catch(e){}},
};

// restore saved fields
$('#f-url').value  = store.get('url', location.origin);
$('#f-user').value = store.get('user','nc');
$('#f-pass').value = store.get('pass','');
try{localStorage.removeItem('nc.pin')}catch(e){}  // PIN no longer stored; pairing replaces it
$('#f-cursor').checked = store.get('cursor','1')==='1';
$('#f-relay').checked  = store.get('relay','0')==='1';

let ws, pc, dc, ctl, statsTimer, watchdog, cfg, hostName, audioTx=null, micStream=null;
let localCursor=true, retryWanted=false, retries=0, lastFrames=0;

function msg(t,cls){const m=$('#f-msg');m.textContent=t||'';m.className='msg '+(cls||'info');}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1600);}

let token=null, mode='insecure';

// Pairing: the host returns a signed token after a correct PIN. We keep one per
// rendezvous+host and send it next time, so the PIN is typed once.
function pairKey(h){ return 'pair:'+$('#f-url').value.replace(/\/$/,'')+'|'+h; }
function getPair(h){ return store.get(pairKey(h),''); }
function setPair(h,t){ store.set(pairKey(h),t); }
function clearPair(h){ try{localStorage.removeItem('nc.'+pairKey(h))}catch(e){} }
function showPairState(){
  const h=$('#f-host').value, paired=!!(h&&getPair(h));
  $('#f-pin').placeholder = paired ? 'paired — PIN not needed' : '6 digits';
}

// One credential exchange: POST /auth -> token. The page itself needs no auth,
// so the browser never shows its own login dialog; this form asks once.
async function authenticate(){
  const base=$('#f-url').value.replace(/\/$/,'');
  const r=await fetch(base+'/auth',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({user:$('#f-user').value, password:$('#f-pass').value}),
  });
  if(r.status===401) throw new Error('Password rejected');
  if(!r.ok) throw new Error('Rendezvous HTTP '+r.status);
  const j=await r.json();
  token=j.token; mode=j.mode||'insecure';
  return token;
}

async function api(path){
  const url=$('#f-url').value.replace(/\/$/,'')+path;
  if(!token) await authenticate();
  let r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
  if(r.status===401){ token=null; await authenticate(); r=await fetch(url,{headers:{Authorization:'Bearer '+token}}); }
  if(r.status===401) throw new Error('Password rejected');
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

async function refreshHosts(){
  try{
    const hosts=await api('/hosts');
    const sel=$('#f-host'), prev=store.get('host','');
    sel.innerHTML='';
    if(!hosts.length){sel.innerHTML='<option value="">no hosts online</option>';return;}
    for(const h of hosts){const o=document.createElement('option');o.value=o.textContent=h;sel.appendChild(o);}
    if(hosts.includes(prev)) sel.value=prev;
    showPairState();
    msg('');
  }catch(e){msg(e.message,'err');}
}
$('#f-refresh').onclick=refreshHosts;
$('#f-host').addEventListener('change',showPairState);
$('#f-url').addEventListener('change',refreshHosts);
$('#f-pass').addEventListener('change',refreshHosts);

function wsURL(){
  const u=new URL($('#f-url').value);
  return (u.protocol==='https:'?'wss:':'ws:')+'//'+u.host+'/ws?token='+encodeURIComponent(token||'');
}

$('#f-connect').onclick=()=>startConnect(false);

async function startConnect(isRetry){
  const btn=$('#f-connect');
  if(!isRetry){
    hostName=$('#f-host').value;
    if(!hostName){msg('Pick a host','err');return;}
    store.set('url',$('#f-url').value);store.set('user',$('#f-user').value);
    store.set('pass',$('#f-pass').value);
    store.set('host',hostName);
    store.set('cursor',$('#f-cursor').checked?'1':'0');
    store.set('relay',$('#f-relay').checked?'1':'0');
    localCursor=$('#f-cursor').checked;
    retryWanted=true; retries=0;
  }
  btn.disabled=true; btn.classList.add('busy'); btn.textContent='Connecting…';
  msg('fetching config…');
  try{
    await authenticate();
    cfg=await api('/config');
    await openPeer();
  }catch(e){
    msg(e.message,'err'); resetConnectBtn();
  }
}
function resetConnectBtn(){const b=$('#f-connect');b.disabled=false;b.classList.remove('busy');b.textContent='Connect';}

async function openPeer(){
  const rtc={iceServers:cfg.iceServers};
  if($('#f-relay').checked) rtc.iceTransportPolicy='relay';
  pc=new RTCPeerConnection(rtc);
  const stream=new MediaStream();
  const video=$('#v');
  video.srcObject=stream;

  pc.addTransceiver('video',{direction:'recvonly'});
  audioTx = pc.addTransceiver('audio',{direction:'sendrecv'}); // mic attached on demand
  dc=pc.createDataChannel('input',{ordered:false,maxRetransmits:0});
  // reliable + ordered: requests that must not be dropped (screen size, later files and clipboard)
  ctl=pc.createDataChannel('control');
  ctl.onmessage=onCtl;
  ctl.onopen=()=>{ lastDisplay=null; sendDisplay(); sendKeyboard(false); };

  pc.ontrack=ev=>{
    stream.addTrack(ev.track);
    // Reliable attach: unmute for audio, then force playback (connect was a user gesture).
    video.muted=false;
    video.play().catch(()=>{ // autoplay blocked → retry muted so at least video shows
      video.muted=true; video.play().catch(()=>{});
    });
  };
  pc.onicecandidate=e=>{if(e.candidate) sig({type:'ice',to:hostName,candidate:e.candidate.toJSON()});};
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState;
    if(s==='connected'){onConnected();}
    else if(s==='failed'||s==='disconnected'){onDropped();}
  };

  await openWS();
  const offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  sig({type:'offer',to:hostName,sdp:offer.sdp,pin:$('#f-pin').value.trim(),pair:getPair(hostName)});
}

function openWS(){
  return new Promise((res,rej)=>{
    ws=new WebSocket(wsURL());  // token travels in the query string
    ws.onopen=()=>res();
    ws.onerror=e=>rej(new Error('signaling failed (check URL/password)'));
    ws.onmessage=ev=>onSignal(JSON.parse(ev.data));
    ws.onclose=()=>{};
  });
}
function sig(m){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(m)); }

async function onSignal(m){
  if(m.type==='answer'){ if(m.pair) setPair(hostName,m.pair); await pc.setRemoteDescription({type:'answer',sdp:m.sdp}); }
  else if(m.type==='ice'){try{await pc.addIceCandidate(m.candidate);}catch(e){}}
  else if(m.type==='error'){
    msg(m.error,'err');
    if(/pairing/i.test(m.error)){ clearPair(hostName); showPairState(); }
    if(/PIN/i.test(m.error)){retryWanted=false;teardown();resetConnectBtn();}
  }
}

function onConnected(){
  retries=0;
  $('#connect').style.display='none';
  $('#session').classList.add('on');
  $('#reconnect').classList.remove('on');
  $('#dot').className='dot';
  $('#p-net').textContent='connected';
  resetConnectBtn();
  startStats();
  startWatchdog();
  armAutoHide();
}

function onDropped(){
  if(!retryWanted) return;
  $('#reconnect').classList.add('on');
  $('#dot').className='dot bad';
  stopTimers();
  try{pc.close();}catch(e){} try{ws.close();}catch(e){}
  retries++;
  const delay=Math.min(1000*retries,5000);
  setTimeout(()=>{ if(retryWanted) openPeer().catch(()=>onDropped()); },delay);
}

function teardown(){
  retryWanted=false; stopTimers(); setMic(false);

/* ---------- watchdog: detect a frozen/black stream and recover ---------- */
function startWatchdog(){
  lastFrames=0; let stalls=0;
  watchdog=setInterval(async()=>{
    if(!pc) return;
    const r=await pc.getStats(); let f=0;
    r.forEach(s=>{if(s.type==='inbound-rtp'&&s.kind==='video') f=s.framesDecoded||0;});
    if(f<=lastFrames){ stalls++; if(stalls===2) toast('no video — recovering'); if(stalls>=4){stalls=0;onDropped();} }
    else stalls=0;
    lastFrames=f;
  },1000);
}

// rolling time-series for the graphs
const SERIES={fps:[],mbps:[],loss:[],rtt:[],jit:[]}, SPAN=60;
let prevLoss=0;
function push(name,v){const a=SERIES[name];a.push(v);if(a.length>SPAN)a.shift();}
function drawSpark(id,data,color,warnAt){
  const c=document.getElementById(id); if(!c) return;
  const w=c.clientWidth||256,h=c.clientHeight||34,dpr=devicePixelRatio||1;
  if(c.width!==w*dpr){c.width=w*dpr;c.height=h*dpr;}
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  if(!data.length) return;
  const max=Math.max(warnAt||0,...data,1e-6), n=data.length;
  const x=i=>i/(SPAN-1)*w, y=v=>h-2-(v/max)*(h-4);
  // area
  g.beginPath(); g.moveTo(x(SPAN-n),h);
  data.forEach((v,i)=>g.lineTo(x(SPAN-n+i),y(v)));
  g.lineTo(x(SPAN-1),h); g.closePath();
  g.fillStyle=color+'22'; g.fill();
  // line
  g.beginPath();
  data.forEach((v,i)=>{const xx=x(SPAN-n+i),yy=y(v);i?g.lineTo(xx,yy):g.moveTo(xx,yy);});
  g.strokeStyle=color; g.lineWidth=1.5; g.stroke();
}
function drawGraphs(){
  drawSpark('gc-fps',SERIES.fps,'#4c8dff');
  drawSpark('gc-mbps',SERIES.mbps,'#3ad29f');
  drawSpark('gc-loss',SERIES.loss,'#ff5d5d',1);
  drawSpark('gc-rtt',SERIES.rtt,'#ffb454');
  drawSpark('gc-jit',SERIES.jit,'#b98bff');
}
let prev={b:0,f:0,t:0};
function startStats(){
  statsTimer=setInterval(async()=>{
    if(!pc) return;
    const r=await pc.getStats(); let pair,cands={},inb,codec='?';
    r.forEach(s=>{
      if(s.type==='candidate-pair'&&s.nominated&&s.state==='succeeded')pair=s;
      if(s.type==='local-candidate'||s.type==='remote-candidate')cands[s.id]=s;
      if(s.type==='inbound-rtp'&&s.kind==='video')inb=s;
    });
    let relay=false,net='connected';
    if(pair){
      const l=cands[pair.localCandidateId],rc=cands[pair.remoteCandidateId];
      relay=(l&&l.candidateType==='relay')||(rc&&rc.candidateType==='relay');
      net=(relay?'relay':'direct')+' · '+((pair.currentRoundTripTime||0)*1000).toFixed(0)+'ms';
    }
    $('#p-net').textContent = mode==='secure' ? net : net+' · insecure';
    $('#dot').className='dot'+(relay?' relay':'');
    if(inb){
      const now=performance.now(),dt=(now-prev.t)/1000||1;
      const mbps=(inb.bytesReceived-prev.b)*8/dt/1e6, fps=(inb.framesDecoded-prev.f)/dt;
      prev={b:inb.bytesReceived,f:inb.framesDecoded,t:now};
      const dec=inb.framesDecoded?(inb.totalDecodeTime/inb.framesDecoded*1000).toFixed(1):'?';
      r.forEach(s=>{if(s.id===inb.codecId)codec=(s.mimeType||'').split('/')[1]||'?';});
      $('#stats').innerHTML=
        `<div><span class="k">size</span><b>${inb.frameWidth||0}×${inb.frameHeight||0}</b></div>`+
        `<div><span class="k">rate</span><b>${fps.toFixed(0)} fps</b> · ${mbps.toFixed(1)} Mb/s · ${codec}</b></div>`+
        `<div><span class="k">latency</span><b>${net}</b></div>`+
        `<div><span class="k">decode</span>${dec} ms · lost ${inb.packetsLost}</div>`;

      // graphs
      const lossNow=Math.max(0,(inb.packetsLost||0)-prevLoss); prevLoss=inb.packetsLost||0;
      const rttMs=pair?(pair.currentRoundTripTime||0)*1000:0;
      const jit=(inb.jitter||0)*1000;
      push('fps',fps); push('mbps',mbps); push('loss',lossNow); push('rtt',rttMs); push('jit',jit);
      $('#gv-fps').textContent=fps.toFixed(0)+' fps';
      $('#gv-mbps').textContent=mbps.toFixed(1)+' Mb/s';
      $('#gv-loss').textContent=lossNow+' /s';
      $('#gv-rtt').textContent=rttMs.toFixed(0)+' ms';
      $('#gv-jit').textContent=jit.toFixed(1)+' ms';
      if($('#graphs').classList.contains('on')) drawGraphs();
    }
  },1000);
}
function stopTimers(){clearInterval(statsTimer);clearInterval(watchdog);}

/* ---------- microphone ---------- */
// The browser only allows microphone access on https (or localhost), so on a
// plain-http rendezvous this explains why instead of failing silently.
let micCtx=null, micRaf=0, quietSince=0;
async function openMic(deviceId){
  const c={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  if(deviceId) c.deviceId={exact:deviceId};
  return navigator.mediaDevices.getUserMedia({audio:c});
}
async function fillMicList(current){
  const sel=$('#mic-dev'), devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
  sel.innerHTML='';
  for(const d of devs){ const o=document.createElement('option'); o.value=d.deviceId; o.textContent=d.label||'microphone'; sel.appendChild(o); }
  if(current) sel.value=current;
}
function startMeter(stream){
  stopMeter();
  const AC=window.AudioContext||window.webkitAudioContext; micCtx=new AC();
  const an=micCtx.createAnalyser(); an.fftSize=1024;
  micCtx.createMediaStreamSource(stream).connect(an);
  const buf=new Float32Array(an.fftSize), bar=$('#micmeter i');
  quietSince=performance.now();
  (function tick(){
    an.getFloatTimeDomainData(buf);
    let peak=0; for(const v of buf) peak=Math.max(peak,Math.abs(v));
    const db=20*Math.log10(peak||1e-9);                 // -inf..0 dBFS
    bar.style.width=Math.max(0,Math.min(100,(db+60)/60*100))+'%';   // -60 dB = empty, 0 = full
    if(db>-40) quietSince=performance.now();
    $('#micquiet').style.display = performance.now()-quietSince>4000 ? 'inline':'none';
    micRaf=requestAnimationFrame(tick);
  })();
}
function stopMeter(){ cancelAnimationFrame(micRaf); if(micCtx){ micCtx.close(); micCtx=null; } }
async function useMic(deviceId){
  const next=await openMic(deviceId);
  const track=next.getAudioTracks()[0];
  await audioTx.sender.replaceTrack(track);
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  micStream=next;
  const id=track.getSettings().deviceId||deviceId;
  store.set('micdev',id||'');
  await fillMicList(id);
  startMeter(next);
}
async function setMic(on){
  const btn=$('#b-mic');
  if(on){
    if(!window.isSecureContext){ toast('Microphone needs secure mode (https)'); return; }
    try{
      await useMic(store.get('micdev','')||undefined);
      btn.classList.add('active'); $('#micpanel').classList.add('on'); toast('Microphone on');
    }catch(e){
      // a remembered device may be gone (unplugged): fall back to the default once
      if(store.get('micdev','')){ store.set('micdev',''); return setMic(true); }
      toast('Microphone blocked: '+e.message);
    }
  }else{
    stopMeter();
    if(audioTx) await audioTx.sender.replaceTrack(null);
    if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
    btn.classList.remove('active'); $('#micpanel').classList.remove('on');
  }
}
$('#b-mic').onclick=()=>setMic(!micStream);
$('#mic-dev').onchange=e=>useMic(e.target.value).catch(err=>toast('Could not switch: '+err.message));

/* ---------- screen size and scale ---------- */
// The remote screen can match this window, so it is drawn pixel for pixel
// instead of scaled; "sharp" matches physical pixels on Retina displays.
// Scale makes the desktop's text and controls bigger.
const RES=[['window','Match window'],['sharp','Match window, sharp'],['1280x720','1280 × 720'],
           ['1600x900','1600 × 900'],['1920x1080','1920 × 1080'],['2560x1440','2560 × 1440']];
const SCALES=[1,1.25,1.5,1.75,2];
let lastDisplay=null, resizeTimer=0;
for(const [v,label] of RES){ const o=document.createElement('option'); o.value=v; o.textContent=label; $('#d-res').appendChild(o); }
for(const v of SCALES){ const o=document.createElement('option'); o.value=v; o.textContent=Math.round(v*100)+'%'; $('#d-scale').appendChild(o); }
$('#d-res').value=store.get('res','window'); $('#d-scale').value=store.get('scale','1');
function wantedSize(){
  const mode=$('#d-res').value;
  if(mode==='window'||mode==='sharp'){
    const k=mode==='sharp'?(window.devicePixelRatio||1):1;
    let w=window.innerWidth*k, h=window.innerHeight*k;
    const f=Math.min(1,2560/w,1600/h);           // the host caps at 2560x1600
    return [Math.floor(w*f/8)*8, Math.floor(h*f/8)*8];
  }
  return mode.split('x').map(Number);
}
function sendDisplay(){
  if(!ctl||ctl.readyState!=='open') return;
  const [w,h]=wantedSize(), s=parseFloat($('#d-scale').value);
  if(lastDisplay&&lastDisplay.w===w&&lastDisplay.h===h&&lastDisplay.s===s) return;
  lastDisplay={w,h,s};
  ctl.send(JSON.stringify({t:'display',w,h,s}));
  toast(`Screen ${w}×${h} at ${Math.round(s*100)}%`);
}
$('#b-display').onclick=()=>{ const on=$('#disppanel').classList.toggle('on'); $('#b-display').classList.toggle('active',on); };
$('#d-res').onchange=()=>{ store.set('res',$('#d-res').value); sendDisplay(); };
$('#d-scale').onchange=()=>{ store.set('scale',$('#d-scale').value); sendDisplay(); };
window.addEventListener('resize',()=>{
  if(!/^(window|sharp)$/.test($('#d-res').value)) return;
  clearTimeout(resizeTimer); resizeTimer=setTimeout(sendDisplay,700);   // settle before asking
});

/* ---------- keyboard layout ---------- */
// Keys travel as physical positions (so shortcuts and special keys are exact);
// the desktop turns them into characters with a layout, which has to be the
// layout of the keyboard on this device. Remembered per browser.
// 'auto': this browser translates each character to the US key that makes it,
// so QWERTY, Dvorak, Colemak... work with no setting and the desk stays US.
// Layouts whose shifted characters differ from US set the desk layout instead.
const KBDS=[['auto','Automatic (QWERTY, Dvorak, Colemak…)'],['gb','UK'],['de','German'],['fr','French'],['es','Spanish']];
for(const [v,label] of KBDS){ const o=document.createElement('option'); o.value=v; o.textContent=label; $('#d-kbd').appendChild(o); }
$('#d-kbd').value=KBDS.some(k=>k[0]===store.get('kbd','auto'))?store.get('kbd','auto'):'auto';
function sendKeyboard(announce){
  if(!ctl||ctl.readyState!=='open') return;
  const v=$('#d-kbd').value;
  ctl.send(JSON.stringify({t:'keyboard',layout: v==='auto' ? 'us' : v}));
  if(announce) toast('Keyboard: '+$('#d-kbd').selectedOptions[0].textContent);
}
$('#d-kbd').onchange=()=>{ store.set('kbd',$('#d-kbd').value); sendKeyboard(true); };
// On a Mac, ⌘ acts as Ctrl on the desk, so ⌘C/⌘V/⌘Z do what the fingers expect.
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
$('#d-cmdl').hidden=!IS_MAC;
$('#d-cmd').checked=store.get('cmd','ctrl')==='ctrl';
$('#d-cmd').onchange=()=>store.set('cmd',$('#d-cmd').checked?'ctrl':'super');
function cmdIsCtrl(){ return IS_MAC&&$('#d-cmd').checked; }

/* ---------- clipboard (text) ---------- */
// Paste: Ctrl/⌘+V focuses a hidden box so the browser pastes this device's
// clipboard into it (no permission prompt); the text goes to the desk, then
// the V keystroke, both on the ordered control channel.
// Copy: Ctrl/⌘+C or X hands the browser a clipboard write that completes when
// the desk reports the new text (allowed because it starts in the key press).
// Copies made other ways (menus) arrive on their own and are written right
// away, or at the next key press or click where the browser insists on one.
const clipBox=$('#clipbox');
let clipAsked=false, clipIn='', clipPending=null, copyWaiter=null, pasteArmed=false, pasteTimer=0;
function ctlOpen(){ return ctl&&ctl.readyState==='open'; }
function sendClip(text){
  let i=0;
  while(i<text.length){
    let n=Math.min(4096,text.length-i);
    const c=text.charCodeAt(i+n-1);
    if(n>1&&c>=0xD800&&c<=0xDBFF&&i+n<text.length) n--;   // keep surrogate pairs together
    const piece=text.slice(i,i+n); i+=n;
    ctl.send(JSON.stringify({t:'clip',text:piece,more:i<text.length}));
  }
}
function startPaste(){
  pasteArmed=true; clipBox.value=''; clipBox.focus();
  clearTimeout(pasteTimer); pasteTimer=setTimeout(()=>finishPaste(''),400); // no paste event: no text here
}
function finishPaste(text){
  if(!pasteArmed) return;
  pasteArmed=false; clearTimeout(pasteTimer); clipBox.blur();
  if(!ctlOpen()) return;
  if(text) sendClip(text);
  toast(text ? 'Pasted from this device' : "Pasted the desk's clipboard (no text here to send)");
  ctl.send(JSON.stringify({t:'kd',code:'KeyV'})); ctl.send(JSON.stringify({t:'ku',code:'KeyV'}));
}
clipBox.addEventListener('paste',e=>{ e.preventDefault(); finishPaste(e.clipboardData.getData('text/plain')); });
function startCopy(ask='clipget'){
  ctl.send(JSON.stringify({t:ask}));
  if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write) return;
  if(copyWaiter) copyWaiter.rej(new Error('superseded'));
  const w={}; const p=new Promise((res,rej)=>{ w.res=res; w.rej=rej; });
  copyWaiter=w;
  setTimeout(()=>{ if(copyWaiter===w){ copyWaiter=null; w.rej(new Error('timeout')); } },3000);
  navigator.clipboard.write([new ClipboardItem({'text/plain':p})]).then(()=>toast('Copied to this device')).catch(()=>{});
}
function onCtl(ev){
  let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
  if(m.t==='clip'){
    clipIn+=m.text||''; if(m.more) return;
    const t=clipIn; clipIn=''; clipAsked=false;
    if(copyWaiter){ copyWaiter.res(new Blob([t],{type:'text/plain'})); copyWaiter=null; return; }
    clipPending=t; flushClip();
  }else if(m.t==='clipnone'){
    if(copyWaiter){ copyWaiter.rej(new Error('nothing copied')); copyWaiter=null; }
    if(clipAsked){ clipAsked=false; toast("The desk's clipboard has no text"); }
  }
}
function flushClip(){
  if(clipPending===null||!navigator.clipboard) return;
  const t=clipPending;
  navigator.clipboard.writeText(t).then(()=>{ if(clipPending===t) clipPending=null; toast('Copied to this device'); }).catch(()=>{});
}
// The ^V button: no paste event here, so ask for the clipboard (Safari shows
// a small Paste button to confirm, Chrome asks once for permission).
async function pasteButton(){
  let text='';
  try{ text=await navigator.clipboard.readText(); }catch(e){}
  if(!ctlOpen()) return;
  if(text) sendClip(text);
  toast(text ? 'Pasted from this device' : "Pasted the desk's clipboard (no text here to send)");
  for(const [t,code] of [['kd','ControlLeft'],['kd','KeyV'],['ku','KeyV'],['ku','ControlLeft']]) ctl.send(JSON.stringify({t,code}));
}
// Toolbar buttons: move the clipboard without a keystroke, so the desk's own
// menus (right-click → Paste) and this device's apps see it.
$('#b-clipup').onclick=async()=>{
  let text='';
  try{ text=await navigator.clipboard.readText(); }catch(e){}
  if(!ctlOpen()) return;
  if(!text){ toast('No text on this clipboard (or the browser said no)'); return; }
  sendClip(text); toast('Clipboard sent to the desk');
};
$('#b-clipdown').onclick=()=>{ if(!ctlOpen()) return; clipAsked=true; startCopy('clipnow'); };
function isShortcut(e,code,...codes){ return codes.includes(code)&&(e.ctrlKey||(e.metaKey&&cmdIsCtrl()))&&!e.altKey; }

$('#b-full').onclick=()=>{
  const el=document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen();
  else (el.requestFullscreen||el.webkitRequestFullscreen).call(el);

/* ---------- keyboard bar ---------- */
$('#b-keys').onclick=()=>{
  const on=$('#keys').classList.toggle('on');
  $('#b-keys').classList.toggle('active',on);
};
document.querySelectorAll('#keys .key').forEach(k=>{
  k.onclick=e=>{
    e.preventDefault();
    if(k.dataset.combo==='ControlLeft+KeyV'&&ctlOpen()){ pasteButton(); return; }
    if(k.dataset.combo){
      const codes=k.dataset.combo.split('+');
      if(k.dataset.combo==='ControlLeft+KeyC'&&ctlOpen()) startCopy();  // a tap counts as a gesture, like a key press
      codes.forEach(c=>sendKey('kd',c));
      codes.slice().reverse().forEach(c=>sendKey('ku',c));
      return;
    }
    const code=k.dataset.code;
    if(k.classList.contains('sticky')){
      const on=k.classList.toggle('on');
      sendKey(on?'kd':'ku',code);
    }else{ sendKey('kd',code); sendKey('ku',code); }
  };
});

/* ---------- input ---------- */
const video=$('#v'), cursor=$('#cursor'), stage=$('#stage');
let grabbing=false;
function send(o){ if(dc&&dc.readyState==='open') dc.send(JSON.stringify(o)); }
function sendKey(t,code){ send({t,code}); }
function videoRect(){
  const r=video.getBoundingClientRect(), vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return r;
  const sc=Math.min(r.width/vw,r.height/vh), w=vw*sc, h=vh*sc;
  return {left:r.left+(r.width-w)/2, top:r.top+(r.height-h)/2, width:w, height:h};
}
let pending=null;
stage.addEventListener('mousemove',e=>{
  if(localCursor){cursor.classList.add('on');cursor.style.left=e.clientX+'px';cursor.style.top=e.clientY+'px';}
  if(!grabbing) return;
  const r=videoRect();
  pending={t:'mm',x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))};
});
(function flush(){ if(pending){send(pending);pending=null;} requestAnimationFrame(flush); })();
stage.addEventListener('mousedown',e=>{
  flushClip();
  if(!grabbing){setGrab(true);return;}
  e.preventDefault(); send({t:'md',b:e.button});
});
stage.addEventListener('mouseup',e=>{ if(grabbing){e.preventDefault();send({t:'mu',b:e.button});} });
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('wheel',e=>{ if(grabbing){e.preventDefault();send({t:'wh',dx:e.deltaX,dy:e.deltaY});} },{passive:false});
// Character keys are sent as the US key that produces the same character, so
// the desktop (US QWERTY) types what this device's layout typed. Other keys
// (Enter, arrows, F-keys, modifiers) go by physical position.
const US_CODE={};
'abcdefghijklmnopqrstuvwxyz'.split('').forEach(c=>{ US_CODE[c]=US_CODE[c.toUpperCase()]='Key'+c.toUpperCase(); });
'0123456789'.split('').forEach(d=>{ US_CODE[d]='Digit'+d; });
Object.assign(US_CODE,{'!':'Digit1','@':'Digit2','#':'Digit3','$':'Digit4','%':'Digit5','^':'Digit6','&':'Digit7',
  '*':'Digit8','(':'Digit9',')':'Digit0','`':'Backquote','~':'Backquote','-':'Minus','_':'Minus','=':'Equal','+':'Equal',
  '[':'BracketLeft','{':'BracketLeft',']':'BracketRight','}':'BracketRight','\\':'Backslash','|':'Backslash',
  ';':'Semicolon',':':'Semicolon',"'":'Quote','"':'Quote',',':'Comma','<':'Comma','.':'Period','>':'Period',
  '/':'Slash','?':'Slash',' ':'Space'});
const downAs={};   // physical key -> code sent on keydown, so the keyup always matches
function codeFor(e){
  if(cmdIsCtrl()&&(e.code==='MetaLeft'||e.code==='MetaRight')) return e.code==='MetaLeft'?'ControlLeft':'ControlRight';
  if($('#d-kbd').value!=='auto') return e.code;
  return (e.key && e.key.length===1 && US_CODE[e.key]) || e.code;
}
window.addEventListener('keydown',e=>{
  if(!grabbing) return;
  if(e.code==='Escape'&&e.shiftKey){setGrab(false);return;}
  flushClip();
  const c=codeFor(e);
  if(isShortcut(e,c,'KeyV')&&ctlOpen()){
    if(!e.repeat){ downAs[e.code]=null; startPaste(); }  // null: its keyup is not sent either
    return;                                               // no preventDefault: the browser must paste
  }
  e.preventDefault();
  if(e.repeat) return;
  downAs[e.code]=c; send({t:'kd',code:c});
  if(isShortcut(e,c,'KeyC','KeyX')&&ctlOpen()) startCopy();
});
window.addEventListener('keyup',e=>{
  if(!grabbing) return;
  e.preventDefault();
  if(downAs[e.code]===null){ delete downAs[e.code]; return; }
  const c=downAs[e.code]||codeFor(e); delete downAs[e.code]; send({t:'ku',code:c});
  // macOS browsers send no keyup for keys released while ⌘ is held: release them now
  if(e.key==='Meta') for(const k of Object.keys(downAs)){
    if(/^(Shift|Control|Alt|Meta)/.test(k)) continue;
    const d=downAs[k]; delete downAs[k]; if(d) send({t:'ku',code:d});
  }
});
function setGrab(on){
  grabbing=on;
  cursor.classList.toggle('on', on&&localCursor);
  stage.style.cursor = on&&localCursor ? 'none' : 'default';
  toast(on?'Mouse captured · Shift+Esc to release':'Mouse released');
}

/* touch: tap = move + click (works from a phone browser) */
stage.addEventListener('touchstart',e=>{
  if(!e.touches.length) return;
  const t=e.touches[0], r=videoRect();
  send({t:'mm',x:Math.min(1,Math.max(0,(t.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(t.clientY-r.top)/r.height))});
},{passive:true});
stage.addEventListener('touchend',e=>{ flushClip(); send({t:'md',b:0}); send({t:'mu',b:0}); },{passive:true});

/* auto-hide the top bar */
let hideTimer;
function armAutoHide(){
  const bar=$('#bar'), handle=$('#barhandle');
  let edgeTimer=0;
  const show=()=>{ bar.classList.remove('hidden'); clearTimeout(hideTimer); };
  const hideSoon=ms=>{ clearTimeout(hideTimer); hideTimer=setTimeout(()=>{ if(!bar.matches(':hover')) bar.classList.add('hidden'); },ms); };
  // reveal only when the pointer rests at the very top edge for a moment
  window.addEventListener('mousemove',e=>{
    if(e.clientY<=3){ if(!edgeTimer) edgeTimer=setTimeout(()=>{ edgeTimer=0; show(); hideSoon(3000); },250); }
    else { clearTimeout(edgeTimer); edgeTimer=0;
      if(!bar.classList.contains('hidden') && e.clientY>bar.getBoundingClientRect().bottom+40) hideSoon(700); }
  });
  bar.addEventListener('mouseenter',show);
  bar.addEventListener('mouseleave',()=>hideSoon(1200));
  handle.addEventListener('click',()=>{ show(); hideSoon(4000); });
  handle.addEventListener('touchstart',e=>{ e.preventDefault(); show(); hideSoon(5000); },{passive:false});
  show(); hideSoon(3000);   // shown briefly on connect so people know it exists
}

refreshHosts();
</script>
</html>
