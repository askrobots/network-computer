# Make PulseAudio the default ALSA device. There is no sound card on this
# machine, so without this, ALSA apps (Audacity, arecord) default to nothing;
# with it they use the desktop speaker (sink nc) and the phone microphone
# (source nc-mic-in). Ubuntu ships this only as an .example file.
pcm.!default {
    type pulse
    hint {
        show on
        description "Default ALSA Output (currently PulseAudio Sound Server)"
    }
}

ctl.!default {
    type pulse
}
