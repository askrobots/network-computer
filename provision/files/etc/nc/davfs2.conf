# davfs2 settings for ~/Objects (nc-object-files): the object server's files.
# Its WebDAV has no locks (class 1), so davfs2 must not ask for them.
use_locks 0
secrets /etc/nc/davfs2.secrets
# upload a saved file a second after it is closed, not ten
delay_upload 1
# never prompt: the key is in the secrets file or the mount fails
ask_auth 0
# folder listings are rechecked this often (seconds); files by their ETag
dir_refresh 15
