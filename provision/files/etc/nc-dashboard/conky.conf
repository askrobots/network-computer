-- The desktop dashboard: drawn on the desktop (not a window), top right.
-- Numbers change every 5 s but only this text is redrawn, so an idle desk
-- still streams almost nothing. nc-dashboard-info supplies the slow lines.
conky.config = {
  own_window = true, own_window_type = 'desktop', own_window_transparent = true,
  own_window_argb_visual = true, own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  alignment = 'top_right', gap_x = 28, gap_y = 60, minimum_width = 380,
  use_xft = true, font = 'DejaVu Sans Mono:size=11', xftalpha = 1,
  default_color = 'c8d3e0', color1 = '6f8196', color2 = '8fb4ff', color3 = '7fd48a', color4 = 'ff8a7a',
  draw_shades = false, draw_outline = false, draw_borders = false, double_buffer = true,
  update_interval = 5, cpu_avg_samples = 2, net_avg_samples = 2, no_buffers = true,
  background = false, if_up_strictness = 'address',
}
conky.text = [[
${execpi 60 nc-dashboard-info}

${color2}LOAD${color}
cpu      ${cpu cpu0}%  ${cpubar cpu0 8,160}
memory   ${mem} / ${memmax}
uptime   ${uptime_short}

${color2}SPACE${color}
desk     ${fs_used /desk} / ${fs_size /desk}  ${fs_bar 8,110 /desk}
disk     ${fs_used /} / ${fs_size /}  ${fs_bar 8,110 /}

${color2}NETWORK${color}
${if_up eth0}in       ${downspeed eth0}/s   total ${totaldown eth0}
out      ${upspeed eth0}/s   total ${totalup eth0}${endif}
]]
