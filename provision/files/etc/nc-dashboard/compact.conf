-- The dashboard for a middling screen (a laptop, a tablet): the most important
-- numbers in six lines. Chosen by nc-dashboard from the screen size; see
-- docs/DESIGN.md ("less room, less shown").
conky.config = {
  own_window = true, own_window_type = 'desktop', own_window_transparent = true,
  own_window_argb_visual = true, own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  alignment = 'top_right', gap_x = 20, gap_y = 56, minimum_width = 300,
  use_xft = true, font = 'DejaVu Sans Mono:size=10', xftalpha = 1,
  default_color = 'c8d3e0', color1 = '6f8196', color2 = '8fb4ff', color3 = '7fd48a', color4 = 'ff8a7a',
  draw_shades = false, draw_outline = false, draw_borders = false, double_buffer = true,
  update_interval = 5, cpu_avg_samples = 2, net_avg_samples = 2, no_buffers = true,
  background = false, if_up_strictness = 'address',
}
conky.text = [[
${execpi 60 nc-dashboard-info compact}
cpu ${cpu cpu0}%  mem ${memperc}%  ${cpubar cpu0 6,90}
desk ${fs_used_perc /desk}%   disk ${fs_used_perc /}%
${if_up eth0}net in ${downspeed eth0}/s  out ${upspeed eth0}/s${endif}
]]
