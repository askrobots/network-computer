-- The dashboard for a phone-sized screen: three lines, in a size a phone can
-- read (its picture is scaled down), below the taller phone panel.
-- Chosen by nc-dashboard; see docs/DESIGN.md ("less room, less shown").
conky.config = {
  own_window = true, own_window_type = 'desktop', own_window_transparent = true,
  own_window_argb_visual = true, own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  alignment = 'top_right', gap_x = 14, gap_y = 58, minimum_width = 240,
  use_xft = true, font = 'DejaVu Sans Mono:size=12', xftalpha = 1,
  default_color = 'c8d3e0', color1 = '6f8196', color2 = '8fb4ff', color3 = '7fd48a', color4 = 'ff8a7a',
  draw_shades = false, draw_outline = false, draw_borders = false, double_buffer = true,
  update_interval = 5, cpu_avg_samples = 2, no_buffers = true,
  background = false,
}
conky.text = [[
${execpi 60 nc-dashboard-info mini}
cpu ${cpu cpu0}%  mem ${memperc}%  desk ${fs_used_perc /desk}%
]]
